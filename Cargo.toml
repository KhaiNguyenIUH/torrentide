[package]
name = "torrentide"
version = "0.2.0"
edition = "2021"
description = "Lightweight BitTorrent client with a terminal UI and web UI: magnet links, DHT, uTP, encryption and RSS"
license = "MIT"
repository = "https://github.com/KhaiNguyenIUH/torrentide"
homepage = "https://github.com/KhaiNguyenIUH/torrentide"
readme = "README.md"
keywords = ["bittorrent", "torrent", "magnet", "tui", "p2p"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.28.1"
futures = "0.3.34"
hex = "0.4.3"
percent-encoding = "2.3.2"
rand = "0.8.8"
ratatui = "0.29.0"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
socket2 = { version = "0.6.5", features = ["all"] }
sha1 = "0.10.7"
thiserror = "1.0.69"
tokio = { version = "1.53.2", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
webpki-roots = "0.26.11"
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", features = ["use-std"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["test-util"] }
